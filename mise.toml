[tools]
bun = "latest"
node = "24"
lefthook = "latest"
turbo = "latest"

[env]
_.file = ".env"

# Web dev server (TanStack Start/vite). Server + mock provider:
#   cd server && DI_TEST_MODE=1 bun run src/cli.ts --config config.example.yaml
#   mise run dev:mock
[tasks.dev]
description = "Run web dev server (vite dev) in web/"
run = "bun run dev"
dir = "web"

[tasks."dev:mock"]
description = "Run the OpenAI-compatible mock provider on :9000 (CORS-enabled for browser dev)"
run = "bun run evals/mock-provider/main.ts --port 9000"

[tasks.build]
description = "Build web SPA"
run = """
set -e
cd web && bun run build
"""

[tasks.test]
description = "Run vitest across server, worker, web, evals, shared"
run = """
set -e
for pkg in shared server evals; do
  echo "== $pkg =="
  (cd $pkg && bun run --bun vitest run)
done
echo "== web =="
(cd web && bunx vitest run)
"""

[tasks."validate:staged"]
description = "T0: staged-file-scale gate (<2s) — oxfmt/oxlint/import-paths/agents-md-length. Runs in pre-commit."
run = "bun scripts/validate.ts --staged"

[tasks."validate:quick"]
description = "T1: fast in-loop gate (~10s, no test/typecheck) — T0 + ast-grep scan + ratchets. Safe to run freely per change."
run = "bun scripts/validate.ts --quick"

[tasks.validate]
description = "T2: T1 + turbo typecheck/test for files affected since origin/main, queued through task-spooler (ts -S 1) so concurrent invocations never stack tsgo processes. Runs in pre-push."
run = "bun scripts/validate.ts"

[tasks."validate:full"]
description = "T3: milestone gate — T2 + full-repo turbo typecheck/test + knip. Slow; run before merging a batch of work, not per-commit. CI equivalent."
run = "bun scripts/validate.ts --full"

[tasks.release]
description = "Build per-OS release archives into dist/releases/ (requires mise run build first)"
run = "bun run build/release.ts"


[tasks.intl]
description = "Advisory locale consistency check (key parity, empty values, interpolation)"
run = "bun run scripts/check-locales.ts"

[tasks.evals]
description = "Run evals vitest suite"
run = "bun run --bun vitest run"
dir = "evals"

[tasks.logs]
description = "Tail .di/logs/*.log, pretty-printing JSON lines via jq (no logger dependency — the server just writes ndjson)"
run = '''
tail -n 100 -f .di/logs/*.log | jq -rR --unbuffered '
  fromjson? | "\(.time // .timestamp // "") [\(.level // "")] \(.msg // .)" // .]'
'''
[tasks.seed]
description = "Seed demo session (turns + report + tools) via the server API (requires DI server running; DI_URL to override)"
run = "bun scripts/seed-demo.ts"

[tasks.smoke]
description = "Behavioral smoke probe: create session, post turn, assert persisted"
run = '''
curl -sf -m 10 "${DI_URL:-http://localhost:3000}/v1/test/smoke" | jq -e '.ok == true' >/dev/null \
  && echo "smoke ok" || { echo "smoke FAILED" >&2; exit 1; }
'''

# Precondition: a DI server must already be running in test mode:
#   cd server && DI_TEST_MODE=1 bun run src/cli.ts --config config.example.yaml
# Override the target with DI_URL (default http://localhost:3000).
[tasks.e2e]
description = "Run Playwright e2e specs in tests/e2e (requires DI server in test mode running; DI_URL to override)"
run = "bun x playwright test"
dir = "tests/e2e"
