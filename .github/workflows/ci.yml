name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch) so
# CI isn't wasting minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan — fail on committed keys/tokens before building anything.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/main must be resolvable for turbo's affected-filter

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'tsconfig*.json', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install
        run: bun install --frozen-lockfile

      # tests/e2e is not a workspace member: it owns its deps and browsers
      - name: Install e2e deps and chromium
        working-directory: tests/e2e
        run: |
          bun install --frozen-lockfile
          bun x playwright install --with-deps chromium

      - name: Validate (T3 — full typecheck + test + knip, the local `mise run validate:full` equivalent)
        run: bun scripts/validate.ts --full

      - name: Upload e2e results (summary.txt, server.log, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
