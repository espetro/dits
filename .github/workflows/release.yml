name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build web SPA
        run: mise run build

      - name: Build release archives (all targets)
        # name assets after the tag, not git-describe output — the build
        # regenerates committed files, which reports the tree -dirty
        run: DI_VERSION=${{ github.ref_name }} mise run release

      - name: Create GitHub Release with archives
        uses: softprops/action-gh-release@v2
        with:
          files: dist/releases/*.tar.gz
          generate_release_notes: true

  desktop-macos:
    # electrobun builds for the host arch only; macos-latest is arm64 and is
    # the only macOS arch its release matrix publishes a core artifact for
    runs-on: macos-latest
    # toolchain download + native build can stall; cap well under the 6h default
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build electrobun app (web SPA + vendor voice + dmg)
        working-directory: platforms/desktop
        run: bun run scripts/build.ts

      - name: Upload dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/desktop/artifacts/*.dmg
