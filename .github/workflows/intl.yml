name: intl

# Locale gate: `intl-ai check` fails on missing, stale, or invalid target keys
# (icu + placeholder-parity checks). Offline — compares locale files against the
# committed intl-ai.lock.d provenance, no provider needed.
on:
  push:
    branches: [develop, main]
    paths:
      - "apps/web/src/locales/**"
      - "intl-ai.toml"
      - "intl-ai.fill.toml"
      - "scripts/check-locales.ts"
      - "scripts/flatten-locales.ts"
      - ".github/workflows/intl.yml"
  pull_request:
    paths:
      - "apps/web/src/locales/**"
      - "intl-ai.toml"
      - "intl-ai.fill.toml"
      - "scripts/check-locales.ts"
      - "scripts/flatten-locales.ts"
      - ".github/workflows/intl.yml"

jobs:
  intl-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: check locale files
        run: bunx intl-ai check
