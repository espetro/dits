name: intl

# Advisory (non-blocking) locale consistency check: key parity with en.json,
# no empty values, interpolation placeholders in sync.
on:
  push:
    branches: [develop, main]
    paths:
      - "apps/web/src/locales/**"
      - "scripts/check-locales.ts"
      - ".github/workflows/intl.yml"
  pull_request:
    paths:
      - "apps/web/src/locales/**"
      - "scripts/check-locales.ts"
      - ".github/workflows/intl.yml"

jobs:
  check-locales:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: check locale files
        run: bun run scripts/check-locales.ts
