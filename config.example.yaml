# Example config for local development with the in-repo mock provider.
# Start the mock provider first: bun run packages/evals/mock-provider/main.ts --port 9000

server:
  port: 3000
  auth: none

llm:
  provider: mock
  base_url: http://localhost:9000/v1
  model: mock-llm

# stt/tts default to the bundled wasm engines (sherpa-onnx + kitten-tts):
# zero-config voice — the ~50MB model bundle downloads into files.data_dir
# on first run. To point at remote providers instead, set provider: remote
# plus base_url/model (/v1-compatible), e.g. the mock provider:
#
# stt:
#   provider: remote
#   base_url: http://localhost:9000/v1
#   model: mock-stt
#   mode: buffered
# tts:
#   provider: remote
#   base_url: http://localhost:9000/v1
#   model: mock-tts
#   voice: alloy

stt:
  provider: builtin

tts:
  provider: builtin

# optional: enables document ingestion (RAG). omit to disable file uploads.
embeddings:
  base_url: http://localhost:9000/v1
  model: mock-embed

# optional: paths for the sqlite db, log and data dir. when omitted (default)
# everything lands in the platform app-support dir —
# ~/Library/Application Support/di, %APPDATA%/di, $XDG_DATA_HOME/di or
# ~/.local/share/di — which is what the desktop sidecar uses by default.
# uncomment to pin them elsewhere (e.g. cwd-local for dev):
# files:
#   db_path: .di/di.db
#   log_path: .di/di.log
#   data_dir: .di/data

# optional ops tunables. every default below matches the code when the
# section is omitted, so these are no-ops unless you change the values.
#
# voice:
#   kickoff_ms: 5000        # delay before the agent's opening turn
#   max_tool_output: 4000   # chars of tool output fed to the llm
#
# check:
#   timeout_ms: 3000        # `di --check` provider probe budget
#
# documents:                # RAG ingestion caps + chunking
#   max_files: 10
#   max_total_bytes: 20971520
#   chunk_size: 1000
#   chunk_overlap: 150
#   context_top_k: 8        # chunks returned by /v1/sessions/:id/context
#
# llm.max_tokens also exists (completion cap; anthropic flavor defaults to
# 1024, openai-shaped calls send no cap unless set).
