id: no-inline-object-param-type
language: TypeScript
severity: warning
message: >
  Inline object-type parameter annotation. Extract a named interface (see
  AGENTS.md type-style rules) so the shape is reusable and shows up in
  hovers/errors by name instead of structurally.
files:
  - "packages/shared/src/**/*.ts"
  - "apps/server/src/**/*.ts"
  - "apps/web/src/**/*.ts"
ignores:
  - "**/*.test.ts"
rule:
  kind: object_type
  inside:
    any:
      - kind: required_parameter
      - kind: optional_parameter
