id: no-intersection-composition
language: TypeScript
severity: warning
message: >
  Object-shape composition via `&` recomputes structurally on every check.
  Prefer `interface X extends A, B` — interface members are resolved lazily
  and cached, which keeps the type-aware lint/tsc tiers cheap.
files:
  - "packages/shared/src/**/*.ts"
  - "apps/server/src/**/*.ts"
  - "apps/web/src/**/*.ts"
rule:
  kind: type_alias_declaration
  has:
    kind: intersection_type
